name: Filter final subscription

on:
  push:
    paths:
      - "data/alive/**.json"
      - "data/candidates.yaml"
      - "scripts/filter_final.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install PyYAML

      - name: Build final subscription
        run: python scripts/filter_final.py --candidates data/candidates.yaml --alive "data/alive/*.json" --output data/final.yaml

      - name: Commit final data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update final subscription
          file_pattern: data/final.yaml data/final.json

