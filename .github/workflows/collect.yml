name: Collect candidates

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install PyYAML

      - name: Collect candidate proxies
        env:
          CANDIDATES_URL: ${{ vars.CANDIDATES_URL }}
          SOURCES_JSON: ${{ vars.SOURCES_JSON || secrets.SOURCES_JSON }}
        run: |
          mkdir -p data
          python scripts/collect_sources.py --config config/sources.public.json --output-yaml data/candidates.yaml --output-json data/candidates.json

      - name: Commit data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update candidate data
          file_pattern: data/candidates.yaml data/candidates.json
