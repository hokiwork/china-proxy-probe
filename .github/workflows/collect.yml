name: Collect candidates

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install PyYAML

      - name: Download candidate Clash YAML
        env:
          CANDIDATES_URL: ${{ vars.CANDIDATES_URL }}
        run: |
          test -n "$CANDIDATES_URL"
          mkdir -p data
          curl -L --fail --retry 3 "$CANDIDATES_URL" -o data/candidates.yaml

      - name: Export probe JSON
        run: python scripts/export_candidates.py --input data/candidates.yaml --output data/candidates.json

      - name: Commit data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update candidate data
          file_pattern: data/candidates.yaml data/candidates.json

